# Lancement : docker compose -p demo-ticket-us-1-1-a up --build
# Les valeurs viennent du fichier .env (voir .env.example) ou des valeurs par défaut ci-dessous.
services:
  web:
    build:
      context: .
      args:
        VITE_SITE_NAME: ${VITE_SITE_NAME:-Cv en Ligne}
        VITE_DEFAULT_LOCALE: ${VITE_DEFAULT_LOCALE:-fr}
    image: demo-ticket-us-1-1-a-web
    ports:
      - '${WEB_PORT:-8080}:8080'
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
